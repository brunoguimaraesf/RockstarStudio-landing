<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/brand/rockstar-logo.jpeg" />
    <link rel="apple-touch-icon" href="/images/brand/rockstar-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />

    <!-- Indexacao: permite preview de imagem GRANDE nos resultados (bom para um
         site visual de nail art) e snippet completo. -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="author" content="Rockstar Studio" />
    <meta name="geo.region" content="BR-GO" />
    <meta name="geo.placename" content="Rio Verde" />

    <title>Nail Art e Nail Designer em Rio Verde - GO | Rockstar Studio</title>

    <!-- Open Graph / redes sociais: lido por scrapers que NAO executam JS
         (WhatsApp, Facebook). O SEO por rota (canonical/title/description) e
         feito no React 19 via src/components/Seo.tsx. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rockstar Studio" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Nail Art e Nail Designer em Rio Verde - GO | Rockstar Studio"
    />
    <meta
      property="og:description"
      content="Nail art autoral, nail design e unhas alternativas (góticas, kawaii, chrome) em Rio Verde - GO. Unhas em gel, press on artesanais e curso de nail designer. Agende pelo WhatsApp."
    />
    <meta
      property="og:image"
      content="https://www.rockstarstudio.com.br/images/brand/rockstar-logo.jpeg"
    />
    <meta
      property="og:image:alt"
      content="Rockstar Studio — nail art autoral em Rio Verde - GO"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Nail Art e Nail Designer em Rio Verde - GO | Rockstar Studio"
    />
    <meta
      name="twitter:description"
      content="Nail art autoral, nail design e unhas alternativas (góticas, kawaii, chrome) em Rio Verde - GO. Unhas em gel, press on artesanais e curso de nail designer. Agende pelo WhatsApp."
    />
    <meta
      name="twitter:image"
      content="https://www.rockstarstudio.com.br/images/brand/rockstar-logo.jpeg"
    />
    <meta
      name="twitter:image:alt"
      content="Rockstar Studio — nail art autoral em Rio Verde - GO"
    />

    <!-- Dados estruturados do negocio local (NailSalon). Ajuda o Google a
         entender que e um salao de unhas em Rio Verde - GO nas buscas locais.
         Endereco/horario/geo entram assim que confirmados pela dona. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NailSalon",
        "@id": "https://www.rockstarstudio.com.br/#business",
        "name": "Rockstar Studio",
        "alternateName": "Rockstar Studio Nail Art",
        "description": "Nail art autoral, nail design, unhas em gel e press on artesanais em Rio Verde - GO.",
        "url": "https://www.rockstarstudio.com.br/",
        "image": [
          "https://www.rockstarstudio.com.br/images/brand/rockstar-logo.jpeg",
          "https://www.rockstarstudio.com.br/images/works/AUTORAL%201.webp",
          "https://www.rockstarstudio.com.br/images/works/GOTICO%201.webp"
        ],
        "logo": "https://www.rockstarstudio.com.br/images/brand/rockstar-logo.jpeg",
        "slogan": "Nail art autoral com estética, atitude e presença.",
        "telephone": "+5564981624311",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+5564981624311",
          "contactType": "customer service",
          "areaServed": "BR",
          "availableLanguage": "Portuguese"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rio Verde",
          "addressRegion": "GO",
          "addressCountry": "BR"
        },
        "areaServed": {
          "@type": "City",
          "name": "Rio Verde"
        },
        "knowsAbout": [
          "Nail Art",
          "Nail Design",
          "Nail designer",
          "Manicure",
          "Unhas em gel",
          "Unhas alternativas",
          "Unhas góticas",
          "Unhas kawaii",
          "Nail art alternativa",
          "Press on",
          "Unhas postiças",
          "Curso de nail art",
          "Formação de nail designer"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Nail art autoral e nail design"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Unhas alternativas (góticas, kawaii, chrome, stiletto)"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Press on artesanal sob encomenda (unhas postiças)"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Curso de nail art / formação de nail designer"
            }
          }
        ],
        "sameAs": ["https://www.instagram.com/_rockstarstudio/"]
      }
    </script>
    <!-- Identidade do site (WebSite). Declara ao Google qual e o nome do site
         nos resultados de busca e liga o dominio ao negocio (#business).
         Sem SearchAction: o site nao tem busca interna. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.rockstarstudio.com.br/#website",
        "url": "https://www.rockstarstudio.com.br/",
        "name": "Rockstar Studio",
        "alternateName": "Rockstar Studio Nail Art",
        "inLanguage": "pt-BR",
        "publisher": {
          "@id": "https://www.rockstarstudio.com.br/#business"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
